<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit Employee' if employee else 'Employee Registration' }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4> {{ 'Edit Employee' if employee else 'Employee Registration' }}</h4>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <!-- <form method="POST" action="{{ url_for('add_employee') }}"> -->
            <form method="POST" enctype="multipart/form-data"
      action="{{ url_for('update_employee', id=employee.id) if employee else url_for('add_employee') }}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Employee Code</label>
                        <input type="text" name="employee_code" class="form-control" 
                        value="{{ employee.employee_code if employee else '' }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>First Name</label>
                        <input type="text" name="first_name"
                        class="form-control" value="{{ employee.first_name if employee else '' }}"required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Last Name</label>
                        <input type="text" name="last_name" value="{{ employee.last_name if employee else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ employee.email if employee else '' }}"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone" value="{{ employee.phone if employee else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Department</label>
                        <select name="department" class="form-select">
                            <option value="">Select Department</option>
                            <option value="IT" {% if employee and employee.department == 'IT' %}selected{% endif %}>IT</option>
                            <option value="HR" {% if employee and employee.department == 'HR' %}selected{% endif %}>HR</option>
                            <option value="Finance" {% if employee and employee.department == 'Finance' %}selected{% endif %}>Finance</option>
                            <option value="Sales"  {% if employee and employee.department == 'Sales' %}selected{% endif %}>Sales</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Designation</label>
                        <input type="text" name="designation" value="{{ employee.designation if employee else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Salary</label>
                        <input type="number" name="salary" value="{{ employee.salary if employee else '' }}"
                               class="form-control" step="0.01" min="0">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Joining Date</label>
                        <input type="date" name="joining_date" value="{{ employee.joining_date if employee else '' }}"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Status</label>
                        <select name="status" class="form-select">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                </div>

               <div class="mb-3">

                    <label class="form-label">Employee Profile Image</label>

                    {% if employee and employee.profile_image %}

                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/' + employee.profile_image) }}"
                                width="100"
                                height="100"
                                style="border-radius:50%; object-fit:cover;">
                        </div>

                    {% endif %}

                    <input type="file"
                        name="profile_image"
                        class="form-control"
                        accept=".jpg,.jpeg,.png">

                </div>

                <!-- <button type="submit" class="btn btn-success">
                    Save Employee
                </button> -->

                <button type="submit" class="btn btn-success">
                {{ 'Update Employee' if employee else 'Save Employee' }}
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
