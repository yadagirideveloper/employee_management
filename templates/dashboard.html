<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Employee Dashboard</h2>

    <div class="row">

        <!-- Total Employees -->
        <div class="col-md-3">
            <div class="card bg-primary text-white mb-3">
                <div class="card-body">
                    <h5>Total Employees</h5>
                    <h2>{{ total_employees }}</h2>
                </div>
            </div>
        </div>

        <!-- Active Employees -->
        <div class="col-md-3">
            <div class="card bg-success text-white mb-3">
                <div class="card-body">
                    <h5>Active Employees</h5>
                    <h2>{{ active_employees }}</h2>
                </div>
            </div>
        </div>

        <!-- Inactive Employees -->
        <div class="col-md-3">
            <div class="card bg-danger text-white mb-3">
                <div class="card-body">
                    <h5>Inactive Employees</h5>
                    <h2>{{ inactive_employees }}</h2>
                </div>
            </div>
        </div>

        <!-- Total Departments -->
        <div class="col-md-3">
            <div class="card bg-warning text-dark mb-3">
                <div class="card-body">
                    <h5>Total Departments</h5>
                    <h2>{{ total_departments }}</h2>
                </div>
            </div>
        </div>

    </div>

    <a href="{{ url_for('employee_list') }}"
       class="btn btn-primary mt-3">
        View Employees
    </a>

</div>

</body>
</html>
