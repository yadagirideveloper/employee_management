<!DOCTYPE html>

<html> <head>     <title>Forgot Password</title>     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> </head> <body>

<div class="container mt-5">     <div class="row justify-content-center">         <div class="col-md-5">

        <div class="card shadow">
            <div class="card-body">

                <h3 class="text-center mb-4">Forgot Password</h3>

                <form method="POST" action="{{ url_for('forgot_password') }}">

                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your registered email"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Reset Link
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}">Back to Login</a>
                </div>

            </div>
        </div>

    </div>
</div>

</div>

</body>
</html>
